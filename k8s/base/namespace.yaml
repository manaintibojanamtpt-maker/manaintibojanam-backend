apiVersion: v1
kind: Namespace
metadata:
  name: bhojanos-staging-spine
  labels:
    environment: staging
    app.kubernetes.io/part-of: bhojanos
    pod-security.kubernetes.io/enforce: restricted

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-spine-quota
  namespace: bhojanos-staging-spine
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "50"
