services:
  - type: web
    name: bhojanos-prod-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORDERBHOJAN_URL
        value: https://orderbhojan.web.app
      - key: FOUNDER_STOREFRONT_URL
        value: https://www.bhojanos.com/k/mana-inti
      - key: PUBLIC_APP_URL
        value: https://www.bhojanos.com
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: CORS_ALLOWED_ORIGINS
        value: https://orderbhojan.web.app,https://www.orderbhojan.com,https://orderbhojan.com,https://www.bhojanos.com,https://bhojanos.com,http://localhost:5173,http://localhost:5174,http://localhost:5180,http://localhost:8080,http://localhost:8081
