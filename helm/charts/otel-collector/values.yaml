image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.96.0"

config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
    prometheus:
      config:
        scrape_configs:
          - job_name: spine-workers
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [bhojanos-staging-spine]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
  processors:
    batch: {}
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
    resource:
      attributes:
        - key: environment
          value: staging
          action: upsert
  exporters:
    prometheus:
      endpoint: 0.0.0.0:8889
    logging:
      loglevel: info
    otlp/tempo:
      endpoint: tempo:4317
      tls: { insecure: true }
  service:
    pipelines:
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch, resource]
        exporters: [prometheus]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [otlp/tempo, logging]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [logging]
