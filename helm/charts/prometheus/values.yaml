retention: 15d
scrapeInterval: 15s

scrapeConfigs:
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [bhojanos-staging-spine]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: prod-flag-guard
    static_configs:
      - targets: [prod-flag-guard:9090]

alertRules:
  - alert: OutboxDepthHigh
    expr: outbox_depth > 1000
    for: 5m
    labels: { severity: critical }
  - alert: ParityBelow97
    expr: order_parity_match_rate < 0.97
    for: 10m
    labels: { severity: critical }
  - alert: ProjectionLagHigh
    expr: projection_lag_ms > 30000
    for: 5m
    labels: { severity: warning }
  - alert: ProdSpineFlagOn
    expr: prod_spine_flags_enabled_count > 0
    for: 1m
    labels: { severity: critical }
