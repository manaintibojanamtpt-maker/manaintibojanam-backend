apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhojanos-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: bhojanos-api }
  template:
    metadata:
      labels: { app: bhojanos-api, tier: api, prometheus.io/scrape: "true" }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: VITE_APP_ENV, value: staging }
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 15
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bhojanos-api
spec:
  type: {{ .Values.service.type }}
  selector: { app: bhojanos-api }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bhojanos-api
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
spec:
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: bhojanos-api
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
