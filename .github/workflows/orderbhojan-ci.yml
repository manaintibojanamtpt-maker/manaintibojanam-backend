name: OrderBhojan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            orderbhojan/package-lock.json
            packages/design-system/package-lock.json
            packages/marketplace-contracts/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace package dependencies
        run: |
          npm ci --prefix ./packages/design-system
          npm ci --prefix ./packages/marketplace-contracts

      - name: Build workspace packages
        run: |
          npm run build --prefix ./packages/marketplace-contracts
          npm run build --prefix ./packages/design-system

      - name: Install orderbhojan dependencies
        run: npm ci
        working-directory: orderbhojan

      - name: Production readiness gate
        run: npm run gate:prod
        working-directory: orderbhojan

      - name: Validate Firebase hosting targets
        run: npm run firebase:validate-hosting
