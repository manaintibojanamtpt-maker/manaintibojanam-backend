name: OrderBhojan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-prod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orderbhojan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: orderbhojan/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production readiness gate
        run: npm run gate:prod
