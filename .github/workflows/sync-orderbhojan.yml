name: Sync OrderBhojan Repo

on:
  push:
    branches: [main]
    paths:
      - 'orderbhojan/**'
      - 'packages/marketplace-contracts/**'
      - 'packages/design-system/**'
      - 'packages/location-core/**'
      - 'src/**'
      - 'scripts/sync-orderbhojan-repo.mjs'
      - 'scripts/e2e/**'
  workflow_dispatch:

concurrency:
  group: sync-orderbhojan
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect sync token
        id: sync
        env:
          ORDERBHOJAN_SYNC_TOKEN: ${{ secrets.ORDERBHOJAN_SYNC_TOKEN }}
        run: |
          if [ -z "$ORDERBHOJAN_SYNC_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sync skipped::Add repository secret ORDERBHOJAN_SYNC_TOKEN (PAT with contents:write on manaintibojanamtpt-maker/orderbhojan) to enable automatic standalone repo sync."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync and push to orderbhojan repo
        if: steps.sync.outputs.enabled == 'true'
        env:
          CI: 'true'
          ORDERBHOJAN_SYNC_TOKEN: ${{ secrets.ORDERBHOJAN_SYNC_TOKEN }}
        run: node scripts/sync-orderbhojan-repo.mjs --push
