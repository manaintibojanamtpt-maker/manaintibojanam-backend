name: IaC Build Containers

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - 'infra/containers/**'
      - '.github/workflows/iac-build-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: asia-south1-docker.pkg.dev/bhojanos-staging/bhojanos-staging

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - bhojanos-api
          - order-projection-worker
          - menu-projection-worker
          - replay-service
          - outbox-service

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -f infra/containers/${{ matrix.service }}.Dockerfile -t "$IMAGE" -t "${{ env.REGISTRY }}/${{ matrix.service }}:staging-latest" .
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/${{ matrix.service }}:staging-latest"

      - name: Run SDK regression gate
        run: npm ci && npm run test:sdk
