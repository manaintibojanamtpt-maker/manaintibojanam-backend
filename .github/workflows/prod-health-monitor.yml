name: Production Health Monitor

on:
  schedule:
    # Every 15 minutes — keeps Render free tier awake and catches prod regressions early.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-health-monitor
  cancel-in-progress: false

jobs:
  prod-health:
    name: Prod smoke + release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ops health smoke (API + static URLs)
        id: smoke
        env:
          API_URL: https://manaintibojanam-backend.onrender.com
        run: node scripts/smoke-ops-health.mjs

      - name: Release gate (discovery + search)
        id: gate
        env:
          RELEASE_API_BASE: https://manaintibojanam-backend.onrender.com
        run: node scripts/release-gate.mjs

      - name: Verify tsconfig baseUrl guard
        run: node scripts/verify-tsconfig-baseurl.mjs

      - name: Open GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Prod Health Monitor] production checks failed';
            const body = [
              'Scheduled production health monitor failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Checks:',
              '- `node scripts/smoke-ops-health.mjs` (API /api/health + static URLs)',
              '- `node scripts/release-gate.mjs` (discovery + search)',
              '- `node scripts/verify-tsconfig-baseurl.mjs`',
              '',
              'Manual repro:',
              '```bash',
              'API_URL=https://manaintibojanam-backend.onrender.com node scripts/smoke-ops-health.mjs',
              'RELEASE_API_BASE=https://manaintibojanam-backend.onrender.com node scripts/release-gate.mjs',
              '```',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-health-monitor',
              per_page: 5,
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurring failure at ${new Date().toISOString()}\n\n${body}`,
              });
              core.info(`Updated existing issue #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['prod-health-monitor', 'ops'],
            });
